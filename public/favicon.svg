<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="50%" style="stop-color:#b537f2"/>
      <stop offset="100%" style="stop-color:#ff2e97"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)" opacity="0.15"/>
  
  <!-- Portfolio briefcase -->
  <rect x="20" y="30" width="60" height="40" rx="4" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  <rect x="25" y="35" width="50" height="30" rx="2" fill="url(#grad)" opacity="0.2"/>
  
  <!-- Handle -->
  <path d="M 30 30 Q 50 20 70 30" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Code symbol -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#grad)" text-anchor="middle" opacity="0.9">&lt;/&gt;</text>
</svg>
